[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excore"
version = "1.0.0"
description = "Hardware-aware CPU quantization search engine and decentralized benchmark registry"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0", "numpy>=1.26"]

[project.scripts]
excore = "excore.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "gguf>=0.10", "psutil>=5.9"]
eval = ["psutil>=5.9"]
llama = ["llama-cpp-python"]

[tool.setuptools.packages.find]
include = ["excore*", "evaluator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
