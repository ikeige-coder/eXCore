name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest
      - name: Every checked-in manifest must be legal
        run: |
          for f in experiments/base_variants/*.yaml manifests/*.yaml; do
            [ -e "$f" ] && python -m excore check "$f"
          done
          true
