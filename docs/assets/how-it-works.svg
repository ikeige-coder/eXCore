<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 190" width="960" height="190" role="img" aria-label="Five steps: write a recipe, build the model, audit it, measure drift, speed and memory, and keep it only if nothing beats it on every measure." font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><defs><radialGradient id="vg" cx="0.2" cy="0.4" r="0.9"><stop offset="0" stop-color="#101c25"/><stop offset="1" stop-color="#0a0c0f"/></radialGradient><marker id="ar" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0 0 L8 5 L0 10 z" fill="#00E5FF"/></marker></defs><rect width="960" height="190" rx="16" fill="#0a0c0f"/><rect width="960" height="190" rx="16" fill="url(#vg)"/><rect x="0.75" y="0.75" width="958.5" height="188.5" rx="15.5" fill="none" stroke="#252b33" stroke-width="1.5"/><rect x="22" y="30" width="160" height="130" rx="14" fill="#12161b" stroke="#252b33" stroke-width="1.5"/><circle cx="48" cy="58" r="14" fill="#00E5FF"/><text x="48" y="63" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0c0f">1</text><text x="70" y="63" font-size="13.5" font-weight="700" fill="#e9ecf0">Write a recipe</text><text x="38" y="98" font-size="11.5" fill="#8a96a6">one YAML file:</text><text x="38" y="116" font-size="11.5" fill="#8a96a6">a format per layer</text><line x1="185" y1="95" x2="206" y2="95" stroke="#00E5FF" stroke-width="2" marker-end="url(#ar)"/><rect x="209" y="30" width="160" height="130" rx="14" fill="#12161b" stroke="#252b33" stroke-width="1.5"/><circle cx="235" cy="58" r="14" fill="#00E5FF"/><text x="235" y="63" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0c0f">2</text><text x="257" y="63" font-size="13.5" font-weight="700" fill="#e9ecf0">Build the model</text><text x="225" y="98" font-size="11.5" fill="#8a96a6">llama.cpp on CPU,</text><text x="225" y="116" font-size="11.5" fill="#8a96a6">deterministic bytes</text><line x1="372" y1="95" x2="393" y2="95" stroke="#00E5FF" stroke-width="2" marker-end="url(#ar)"/><rect x="396" y="30" width="160" height="130" rx="14" fill="#12161b" stroke="#252b33" stroke-width="1.5"/><circle cx="422" cy="58" r="14" fill="#00E5FF"/><text x="422" y="63" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0c0f">3</text><text x="444" y="63" font-size="13.5" font-weight="700" fill="#e9ecf0">Audit it</text><text x="412" y="98" font-size="11.5" fill="#8a96a6">byte-level proof it is</text><text x="412" y="116" font-size="11.5" fill="#8a96a6">only legal encodings</text><line x1="559" y1="95" x2="580" y2="95" stroke="#00E5FF" stroke-width="2" marker-end="url(#ar)"/><rect x="583" y="30" width="160" height="130" rx="14" fill="#12161b" stroke="#252b33" stroke-width="1.5"/><circle cx="609" cy="58" r="14" fill="#00E5FF"/><text x="609" y="63" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0c0f">4</text><text x="631" y="63" font-size="13.5" font-weight="700" fill="#e9ecf0">Measure</text><text x="599" y="98" font-size="11.5" fill="#8a96a6">drift, decode speed,</text><text x="599" y="116" font-size="11.5" fill="#8a96a6">prefill speed, peak RAM</text><line x1="746" y1="95" x2="767" y2="95" stroke="#00E5FF" stroke-width="2" marker-end="url(#ar)"/><rect x="770" y="30" width="160" height="130" rx="14" fill="#00E5FF" stroke="#00E5FF" stroke-width="1.5"/><circle cx="796" cy="58" r="14" fill="#0a0c0f"/><text x="796" y="63" text-anchor="middle" font-size="14" font-weight="700" fill="#00E5FF">5</text><text x="818" y="63" font-size="13.5" font-weight="700" fill="#0a0c0f">Keep it?</text><text x="786" y="98" font-size="11.5" fill="#0a0c0f">only if nothing beats it</text><text x="786" y="116" font-size="11.5" fill="#0a0c0f">on every measure</text></svg>