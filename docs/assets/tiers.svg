<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-label="Five reward tiers from core:S at 0.5x to core:Ultra at 4.0x." font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><defs><radialGradient id="vg" cx="0.2" cy="0.4" r="0.9"><stop offset="0" stop-color="#101c25"/><stop offset="1" stop-color="#0a0c0f"/></radialGradient><marker id="ar" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0 0 L8 5 L0 10 z" fill="#00E5FF"/></marker></defs><rect width="960" height="250" rx="16" fill="#0a0c0f"/><rect width="960" height="250" rx="16" fill="url(#vg)"/><rect x="0.75" y="0.75" width="958.5" height="248.5" rx="15.5" fill="none" stroke="#252b33" stroke-width="1.5"/><text x="26" y="34" font-size="17" font-weight="700" fill="#e9ecf0">Reward tiers</text><text x="26" y="54" font-size="12" fill="#8a96a6">The more of the frontier a recipe opens up, the higher the tier. Thresholds are the minimum frontier gain.</text><rect x="40" y="165" width="158" height="50" rx="10" fill="#17414b"/><text x="119" y="189" text-anchor="middle" font-size="16" font-weight="800" fill="#e9ecf0">core:S</text><text x="119" y="207" text-anchor="middle" font-size="12.5" fill="#e9ecf0">0.5x · gain 0.5%</text><rect x="218" y="137" width="158" height="78" rx="10" fill="#11677a"/><text x="297" y="161" text-anchor="middle" font-size="16" font-weight="800" fill="#e9ecf0">core:M</text><text x="297" y="179" text-anchor="middle" font-size="12.5" fill="#e9ecf0">1.0x · gain 1.5%</text><rect x="396" y="109" width="158" height="106" rx="10" fill="#0a93ad"/><text x="475" y="133" text-anchor="middle" font-size="16" font-weight="800" fill="#e9ecf0">core:L</text><text x="475" y="151" text-anchor="middle" font-size="12.5" fill="#e9ecf0">1.5x · gain 4%</text><rect x="574" y="81" width="158" height="134" rx="10" fill="#00bcd8"/><text x="653" y="105" text-anchor="middle" font-size="16" font-weight="800" fill="#0a0c0f">core:XL</text><text x="653" y="123" text-anchor="middle" font-size="12.5" fill="#0a0c0f">2.5x · gain 10%</text><rect x="752" y="53" width="158" height="162" rx="10" fill="#00E5FF"/><text x="831" y="77" text-anchor="middle" font-size="16" font-weight="800" fill="#0a0c0f">core:Ultra</text><text x="831" y="95" text-anchor="middle" font-size="12.5" fill="#0a0c0f">4.0x · gain 25%</text><text x="40" y="238" font-size="11.5" fill="#8a96a6">Below core:S there is no reward and no merge. A recipe must also pass every gate and the private holdout.</text></svg>