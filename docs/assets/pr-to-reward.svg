<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 190" width="960" height="190" role="img" aria-label="From pull request to reward: open a PR with one manifest, the bot screens it, it is measured on CPU, a tier is assigned, and it is merged and recorded." font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><defs><radialGradient id="vg" cx="0.2" cy="0.4" r="0.9"><stop offset="0" stop-color="#101c25"/><stop offset="1" stop-color="#0a0c0f"/></radialGradient><marker id="ar" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0 0 L8 5 L0 10 z" fill="#00E5FF"/></marker></defs><rect width="960" height="190" rx="16" fill="#0a0c0f"/><rect width="960" height="190" rx="16" fill="url(#vg)"/><rect x="0.75" y="0.75" width="958.5" height="188.5" rx="15.5" fill="none" stroke="#252b33" stroke-width="1.5"/><rect x="22" y="30" width="160" height="130" rx="14" fill="#12161b" stroke="#252b33" stroke-width="1.5"/><circle cx="48" cy="58" r="14" fill="#00E5FF"/><text x="48" y="63" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0c0f">1</text><text x="70" y="63" font-size="13.5" font-weight="700" fill="#e9ecf0">Open a PR</text><text x="38" y="98" font-size="11.5" fill="#8a96a6">add one new</text><text x="38" y="116" font-size="11.5" fill="#8a96a6">manifest file</text><line x1="185" y1="95" x2="206" y2="95" stroke="#00E5FF" stroke-width="2" marker-end="url(#ar)"/><rect x="209" y="30" width="160" height="130" rx="14" fill="#12161b" stroke="#252b33" stroke-width="1.5"/><circle cx="235" cy="58" r="14" fill="#00E5FF"/><text x="235" y="63" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0c0f">2</text><text x="257" y="63" font-size="13.5" font-weight="700" fill="#e9ecf0">Bot screens it</text><text x="225" y="98" font-size="11.5" fill="#8a96a6">read as data,</text><text x="225" y="116" font-size="11.5" fill="#8a96a6">never run as code</text><line x1="372" y1="95" x2="393" y2="95" stroke="#00E5FF" stroke-width="2" marker-end="url(#ar)"/><rect x="396" y="30" width="160" height="130" rx="14" fill="#12161b" stroke="#252b33" stroke-width="1.5"/><circle cx="422" cy="58" r="14" fill="#00E5FF"/><text x="422" y="63" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0c0f">3</text><text x="444" y="63" font-size="13.5" font-weight="700" fill="#e9ecf0">Measured on CPU</text><text x="412" y="98" font-size="11.5" fill="#8a96a6">quality, speed,</text><text x="412" y="116" font-size="11.5" fill="#8a96a6">memory, long context</text><line x1="559" y1="95" x2="580" y2="95" stroke="#00E5FF" stroke-width="2" marker-end="url(#ar)"/><rect x="583" y="30" width="160" height="130" rx="14" fill="#12161b" stroke="#252b33" stroke-width="1.5"/><circle cx="609" cy="58" r="14" fill="#00E5FF"/><text x="609" y="63" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0c0f">4</text><text x="631" y="63" font-size="13.5" font-weight="700" fill="#e9ecf0">Tier assigned</text><text x="599" y="98" font-size="11.5" fill="#8a96a6">core:S up to</text><text x="599" y="116" font-size="11.5" fill="#8a96a6">core:Ultra</text><line x1="746" y1="95" x2="767" y2="95" stroke="#00E5FF" stroke-width="2" marker-end="url(#ar)"/><rect x="770" y="30" width="160" height="130" rx="14" fill="#00E5FF" stroke="#00E5FF" stroke-width="1.5"/><circle cx="796" cy="58" r="14" fill="#0a0c0f"/><text x="796" y="63" text-anchor="middle" font-size="14" font-weight="700" fill="#00E5FF">5</text><text x="818" y="63" font-size="13.5" font-weight="700" fill="#0a0c0f">Merged + recorded</text><text x="786" y="98" font-size="11.5" fill="#0a0c0f">registry entry</text><text x="786" y="116" font-size="11.5" fill="#0a0c0f">and reward tier</text></svg>